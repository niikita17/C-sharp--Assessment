version: '3.9'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: product-sql
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Password@123"
    ports:
      - "1433:1433"

  api:
    build:
      context: .
      dockerfile: API/Dockerfile
    container_name: product-api
    ports:
      - "8080:8080"
    depends_on:
      - sqlserver